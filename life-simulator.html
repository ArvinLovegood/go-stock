<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浮生一梦 · 人生模拟器</title>
<style>
  /* ===== 基础与配色：暖纸感、衬线字体、克制留白 ===== */
  :root{
    --paper:#f6f1e7;
    --paper-2:#fffdf8;
    --ink:#2b2620;
    --ink-2:#5b5348;
    --ink-3:#8d8375;
    --line:#e0d7c6;
    --line-2:#cec3ae;
    --red:#a8382c;
    --green:#3f6b4f;
    --gold:#9a7b28;
    --blue:#3d5a80;
    --shadow:0 1px 2px rgba(70,58,40,.06), 0 8px 24px rgba(70,58,40,.06);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 12% -10%, #fffaf0 0%, rgba(255,250,240,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #f3ead9 0%, rgba(243,234,217,0) 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  body::before{ /* 极淡的纸张纹理 */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(120,104,78,.09) 1px, transparent 1px);
    background-size:3px 3px;
  }
  .wrap{position:relative;max-width:1080px;margin:0 auto;padding:32px 24px 64px;}
  .hidden{display:none !important;}

  /* ===== 开始页 ===== */
  #start{min-height:76vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px;}
  #start .seal{
    width:74px;height:74px;border:2px solid var(--red);color:var(--red);
    display:grid;place-items:center;font-size:32px;letter-spacing:2px;
    border-radius:4px;transform:rotate(-3deg);box-shadow:var(--shadow);background:var(--paper-2);
  }
  #start h1{font-size:38px;letter-spacing:.22em;margin:4px 0 0;font-weight:600;}
  #start .sub{color:var(--ink-3);letter-spacing:.34em;font-size:12px;font-family:var(--sans);}
  #start .quote{max-width:520px;color:var(--ink-2);line-height:2;font-size:15px;}
  .nameRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;}
  input[type=text]{
    font-family:var(--serif);font-size:16px;color:var(--ink);background:var(--paper-2);
    border:1px solid var(--line-2);border-radius:3px;padding:10px 14px;width:190px;outline:none;
  }
  input[type=text]:focus{border-color:var(--ink-2);}
  .btn{
    font-family:var(--sans);font-size:14px;letter-spacing:.12em;cursor:pointer;
    background:var(--ink);color:#fbf7ef;border:1px solid var(--ink);
    padding:11px 26px;border-radius:3px;transition:.18s;
  }
  .btn:hover{background:#463f36;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2);}
  .btn.ghost:hover{border-color:var(--ink);background:rgba(43,38,32,.04);}

  /* ===== 顶栏 ===== */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;gap:18px;
    border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;
  }
  .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .who .nm{font-size:23px;letter-spacing:.06em;}
  .who .tag{
    font-family:var(--sans);font-size:11px;color:var(--ink-2);border:1px solid var(--line-2);
    padding:3px 8px;border-radius:2px;letter-spacing:.06em;background:var(--paper-2);
  }
  .clock{font-family:var(--sans);color:var(--ink-2);font-size:12px;letter-spacing:.08em;text-align:right;}
  .clock b{font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:600;}

  /* ===== 布局 ===== */
  .grid{display:grid;grid-template-columns:272px 1fr;gap:22px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }

  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);}
  .card .hd{
    font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--ink-3);
    padding:12px 16px;border-bottom:1px solid var(--line);
  }
  .card .bd{padding:16px;}

  /* ===== 属性 ===== */
  .attr{margin-bottom:12px;}
  .attr:last-child{margin-bottom:0;}
  .attr .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px;}
  .attr .row .k{color:var(--ink-2);letter-spacing:.1em;}
  .attr .row .v{font-family:var(--sans);color:var(--ink);font-size:12px;}
  .bar{height:4px;background:#ece4d5;border-radius:2px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;transition:width .5s ease;}
  .bar.b-体质 i{background:#8a6a4a}
  .bar.b-智力 i{background:var(--blue)}
  .bar.b-魅力 i{background:#a1688c}
  .bar.b-心情 i{background:var(--gold)}
  .bar.b-健康 i{background:var(--green)}
  .bar.b-运气 i{background:#6a7f8a}
  .money{
    margin-top:15px;padding-top:13px;border-top:1px dashed var(--line-2);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .money .k{font-family:var(--sans);font-size:11px;letter-spacing:.16em;color:var(--ink-3);}
  .money .v{font-size:19px;}
  .facts{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line-2);font-size:12.5px;color:var(--ink-2);line-height:1.95;}
  .facts span{color:var(--ink-3);}
  .traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .trait{
    font-family:var(--sans);font-size:11px;color:var(--ink-2);
    border:1px solid var(--line-2);border-radius:2px;padding:3px 7px;background:#fbf8f1;
  }

  /* ===== 记事 ===== */
  .log{max-height:52vh;overflow-y:auto;padding:4px 18px 10px;}
  .log::-webkit-scrollbar{width:8px;}
  .log::-webkit-scrollbar-thumb{background:#ded4c1;border-radius:4px;}
  .entry{padding:13px 0;border-bottom:1px dotted var(--line);animation:fin .45s ease both;}
  .entry:last-child{border-bottom:0;}
  @keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .entry .meta{font-family:var(--sans);font-size:11px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:5px;}
  .entry .ttl{font-size:14.5px;letter-spacing:.05em;margin-bottom:4px;}
  .entry .txt{font-size:13.5px;line-height:1.95;color:var(--ink-2);}
  .delta{font-family:var(--sans);font-size:11px;margin-top:6px;display:flex;flex-wrap:wrap;gap:10px;}
  .delta span.up{color:var(--green);}
  .delta span.down{color:var(--red);}
  .delta span.note{color:var(--ink-3);}
  .entry.good .ttl::before{content:"○ ";color:var(--green);}
  .entry.bad .ttl::before{content:"● ";color:var(--red);}
  .entry.plain .ttl::before{content:"· ";color:var(--ink-3);}

  /* ===== 事件面板 ===== */
  .event{margin-top:18px;}
  .event .stage{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--ink-3);margin-bottom:10px;}
  .event h3{margin:0 0 10px;font-size:19px;letter-spacing:.08em;font-weight:600;}
  .event p{margin:0;font-size:14px;line-height:2.05;color:var(--ink-2);}
  .choices{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .choice{
    text-align:left;font-family:var(--serif);font-size:14.5px;color:var(--ink);
    background:#fdfaf3;border:1px solid var(--line-2);border-radius:3px;
    padding:12px 16px;cursor:pointer;transition:.16s;line-height:1.6;
  }
  .choice:hover{background:#f7f1e4;border-color:var(--ink-2);transform:translateX(2px);}
  .footrow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap;}
  .hintline{font-family:var(--sans);font-size:11px;color:var(--ink-3);letter-spacing:.06em;}

  /* ===== 结局 ===== */
  #end .verdict{text-align:center;padding:26px 16px 4px;}
  #end .verdict .rk{font-size:32px;letter-spacing:.24em;margin:10px 0 8px;}
  #end .verdict .sc{font-family:var(--sans);font-size:12px;color:var(--ink-3);letter-spacing:.14em;}
  #end .para{font-size:14.5px;line-height:2.15;color:var(--ink-2);}
  .lines{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin-top:18px;font-size:13.5px;}
  @media (max-width:640px){ .lines{grid-template-columns:1fr;} }
  .lines .li{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:7px 0;}
  .lines .li span{color:var(--ink-3);font-family:var(--sans);font-size:12px;letter-spacing:.08em;}
  .miles{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;}
  .mile{font-family:var(--sans);font-size:11.5px;border:1px solid var(--line-2);border-radius:2px;padding:4px 9px;color:var(--ink-2);background:#fbf8f1;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ 开始页 ============ -->
  <section id="start">
    <div class="seal">浮生</div>
    <h1>人生模拟器</h1>
    <div class="sub">ONE LIFE · ONE RUN</div>
    <p class="quote">从一声啼哭开始，到这个世界的账目结清为止。<br>你会遇到几个岔路口，犯几次错，爱几个人。</p>
    <div class="nameRow">
      <input id="nameInput" type="text" maxlength="8" placeholder="取个名字（可留空）">
      <button class="btn" id="startBtn">开始这一生</button>
    </div>
    <div class="hintline">提示：回车或空格可推进时间</div>
  </section>

  <!-- ============ 主界面 ============ -->
  <section id="game" class="hidden">
    <div class="topbar">
      <div class="who">
        <span class="nm" id="pName">—</span>
        <span class="tag" id="pStage">—</span>
        <span class="tag" id="pEdu">—</span>
        <span class="tag" id="pJob">—</span>
      </div>
      <div class="clock">公元 <b id="pYear">—</b> 年 · <b id="pAge">0</b> 岁</div>
    </div>

    <div class="grid">
      <!-- 左侧：属性 -->
      <div class="card">
        <div class="hd">状 态</div>
        <div class="bd">
          <div id="attrs"></div>
          <div class="money"><span class="k">资 产</span><span class="v" id="pMoney">0.0 万</span></div>
          <div class="facts" id="facts"></div>
          <div class="traits" id="traits"></div>
        </div>
      </div>

      <!-- 右侧：记事 + 事件 -->
      <div>
        <div class="card">
          <div class="hd">人 生 记 事</div>
          <div class="log" id="log"></div>
        </div>

        <div class="card event">
          <div class="bd">
            <div class="stage" id="evStage">—</div>
            <h3 id="evTitle">—</h3>
            <p id="evText"></p>
            <div class="choices" id="evChoices"></div>
            <div class="footrow">
              <span class="hintline" id="evHint"></span>
              <button class="btn" id="nextBtn">继续</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 结局 ============ -->
  <section id="end" class="hidden">
    <div class="card">
      <div class="verdict">
        <div class="sc" id="endSub">—</div>
        <div class="rk" id="endRank">—</div>
        <div class="sc" id="endScore">—</div>
      </div>
      <div class="bd">
        <div class="para" id="endPara"></div>
        <div class="lines" id="endLines"></div>
        <div class="miles" id="endMiles"></div>
        <div class="footrow">
          <span class="hintline">这一生已结束。要不要换一种活法？</span>
          <button class="btn" id="againBtn">再过一生</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
/* =====================================================================
   浮生一梦 · 人生模拟器
   结构：工具 → 数据（天赋/家庭/事件池/职业） → 状态机（逐年推进） → 渲染
   规则要点：
     · 每一年 = 一次结算（收入-支出、自然折旧）+ 一个事件（可能带选择）
     · 选择立刻结算属性/资产，写进记事；「继续」推进到下一年
     · 死亡：健康归零，或 45 岁后按健康/体质逐年判定
   ===================================================================== */

/* ---------- 随机与数值工具 ---------- */
const rnd  = (a, b) => Math.random() * (b - a) + a;
const ri   = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const some = (p) => Math.random() < p;
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const money1 = (v) => (v < 0 ? '-' : '') + Math.abs(v).toFixed(1);

/* 属性展示配置 */
const ATTRS = [
  { k: '体质', cls: 'b-体质' },
  { k: '智力', cls: 'b-智力' },
  { k: '魅力', cls: 'b-魅力' },
  { k: '心情', cls: 'b-心情' },
  { k: '健康', cls: 'b-健康' },
  { k: '运气', cls: 'b-运气' },
];

/* 学历分值（结局评价用） */
const EDU_POINT = { 小学: 1, 初中: 2, 高中: 4, 中专: 4, 大专: 6, 本科: 9, 硕士: 13, 博士: 16 };

/* ---------- 天赋 ---------- */
const TALENTS = [
  { name: '过目不忘', desc: '读书这件事，你天生占便宜', eff: { 智力: 8 } },
  { name: '筋骨清奇', desc: '从小少生病', eff: { 体质: 9, 健康: 5 } },
  { name: '天生丽质', desc: '站在人群里总被多看两眼', eff: { 魅力: 10 } },
  { name: '心宽体胖', desc: '再大的事，睡一觉就过去了', eff: { 心情: 10, 健康: 4 } },
  { name: '锦鲤附体', desc: '抽奖、捡钱、赶上车，总有你', eff: { 运气: 12 } },
  { name: '生财有道', desc: '对钱的事有种直觉', eff: { 运气: 4, 智力: 4 } },
  { name: '嘴甜如蜜', desc: '长辈和领导都容易喜欢你', eff: { 魅力: 7, 心情: 3 } },
  { name: '铁打肠胃', desc: '路边摊也吃不坏', eff: { 体质: 6, 健康: 6 } },
  { name: '夜猫子体质', desc: '熬得住，也想得多', eff: { 智力: 6, 健康: -3 } },
  { name: '钝感力', desc: '别人的话伤不到你', eff: { 心情: 8, 魅力: -2 } },
];

/* ---------- 出身 ---------- */
const FAMILIES = [
  { name: '城市双职工家庭', money: 6,  eff: { 智力: 4, 心情: 4 },           text: '父母都是普通上班族，家里不算宽裕，但该有的都有。' },
  { name: '农村家庭',       money: -1, eff: { 体质: 8, 智力: -2, 心情: 2 }, text: '院子很大，玩具很少，你在泥地里长得结实。' },
  { name: '做生意的家庭',   money: 30, eff: { 魅力: 5, 心情: -3 },          text: '家里常有陌生客人，钱不缺，人却常不在家。' },
  { name: '教师家庭',       money: 8,  eff: { 智力: 9, 心情: -2 },          text: '家里最多的东西是书，最多的话是“再看一会儿”。' },
  { name: '医生家庭',       money: 14, eff: { 智力: 6, 健康: 6 },           text: '你从小闻着消毒水味长大，对生病这件事不太怕。' },
  { name: '单亲家庭',       money: 1,  eff: { 心情: -6, 体质: 3 },          text: '家里只有一个人撑着，你早早学会了不添麻烦。' },
  { name: '下岗工人家庭',   money: -2, eff: { 体质: 6, 心情: -3, 智力: 2 }, text: '父母都在找活干，你懂事得比同龄人早。' },
  { name: '体制内家庭',     money: 12, eff: { 魅力: 4, 心情: 5 },           text: '父母说话做事都稳，你的童年也稳。' },
  { name: '艺术家家庭',     money: 4,  eff: { 魅力: 9, 智力: 3, 心情: -1 }, text: '家里很乱，但很自由，墙上全是没画完的画。' },
];

/* ---------- 职业表 ---------- */
const JOBS = {
  gongwu:     { name: '公务员',   salary: 9,  prestige: 9 },
  bigco:      { name: '企业职员', salary: 20, prestige: 7 },
  soe:        { name: '国企员工', salary: 13, prestige: 6 },
  startup:    { name: '创业者',   salary: 8,  prestige: 6 },
  odd:        { name: '打零工的', salary: 6,  prestige: 2 },
  self:       { name: '个体户',   salary: 10, prestige: 4 },
  researcher: { name: '在读研究生', salary: 1, prestige: 7 },
};

/* =====================================================================
   事件池
   E() 定义事件：id / title / text / ages[起,止] / once（一生一次，默认 true）
                w 权重 / cond(s) 条件 / auto 无选项自动事件 / choices 选项
   C() 定义选项：label / eff 属性增减 / res 结果叙述 / fn(s) 额外副作用
   ===================================================================== */
const E = (o) => Object.assign({ w: 6, once: true }, o);
const C = (label, eff, res, fn) => ({ label, eff, res, fn });

const EVENTS = [
  /* ---------------- 0 - 3 岁 ---------------- */
  E({ id: 'first_word', title: '第一句话', ages: [1, 1], w: 9, auto: true,
      text: '你开口说的第一个词，全家人争论了半个月。',
      eff: { 智力: 3, 心情: 3 } }),
  E({ id: 'baby_fever', title: '半夜发烧', ages: [0, 3], w: 8,
      text: '凌晨两点，你烧到三十九度，大人抱着你往医院跑。',
      choices: [
        C('交给医院，输液观察', { 体质: 3, 健康: -2 }, '挂了两瓶水，天亮时退了烧。'),
        C('家里物理降温，硬扛', { 体质: 1, 健康: 1, 心情: 2 }, '折腾到天亮，居然真的退了。'),
      ] }),
  E({ id: 'walk_early', title: '学步', ages: [1, 2], w: 7, auto: true,
      text: '你扶着凳腿站起来，摇摇晃晃走了三步，摔了两步。',
      eff: { 体质: 3, 魅力: 2 } }),
  E({ id: 'left_alone', title: '走丢了', ages: [3, 5], w: 5,
      text: '在商场里你松开了大人的手，回头时人流已经把那个熟悉的身影淹没了。',
      choices: [
        C('站在原地大哭', { 心情: -4, 体质: -1 }, '嗓子喊哑了才被找到，从此有点怕人多的地方。'),
        C('找服务台求助', { 智力: 4, 心情: 1 }, '广播里响起了你的名字，你被领了回去。'),
      ] }),

  /* ---------------- 4 - 6 岁 ---------------- */
  E({ id: 'kindergarten', title: '入园第一天', ages: [4, 4], w: 8, auto: true,
      text: '门在身后关上，你第一次意识到这一天没有人会来抱你。',
      eff: { 心情: -3, 魅力: 3 } }),
  E({ id: 'interest_class', title: '兴趣班', ages: [5, 8], w: 8,
      text: '父母在你面前摊开几张招生简章：钢琴、画画、乒乓球。',
      choices: [
        C('钢琴', { 魅力: 6, 智力: 3, 心情: -3, money: -2 }, '练到手指发酸，但往后每次聚会上你都有个节目。'),
        C('画画', { 魅力: 4, 心情: 5, 智力: 2, money: -1 }, '你学会了用一支笔打发整个下午。'),
        C('乒乓球', { 体质: 7, 心情: 4, 魅力: 2 }, '一直打到中学，还交了一群球友。'),
        C('什么都不学', { 心情: 6, money: 1 }, '你的童年多出了很多空白的下午。'),
      ] }),
  E({ id: 'stage_first', title: '第一次上台', ages: [5, 8], w: 7,
      text: '六一汇演，老师把节目单上写了你的名字。',
      choices: [
        C('硬着头皮上', { 魅力: 5, 心情: 3, 智力: 2 }, '灯光太亮，你什么也看不清，但念完了整段台词。'),

/* =====================================================================
   状态与流程
   ===================================================================== */
let s = null;       // 当前状态
let pending = null; // 待选择的事件

function stageOf(age) {
  if (age <= 3) return '婴孩';
  if (age <= 6) return '学龄前';
  if (age <= 12) return '小学';
  if (age <= 15) return '初中';
  if (age <= 18) return '高中';
  if (age <= 22) return '大学';
  if (age <= 30) return '初入社会';
  if (age <= 45) return '而立之后';
  if (age <= 59) return '中年';
  if (age <= 74) return '晚年';
  return '耄耋';
}

function newState(name) {
  const fam = pick(FAMILIES);
  const pool = [...TALENTS];
  const talents = [];
  const n = ri(1, 2);
  for (let i = 0; i < n; i++) talents.push(pool.splice(ri(0, pool.length - 1), 1)[0]);

  const st = {
    name: name || pick(['思远', '之遥', '阿禾', '青梧', '念安', '长安', '未名', '行之', '南风', '素心']),
    birth: ri(1975, 2005),
    age: 0,
    money: 0,
    salary: 0,
    loan: false,
    house: false,
    married: false,
    kids: 0,
    edu: '幼儿',
    job: null,
    jobYears: 0,
    family: fam,
    talents,
    achievements: [],
    log: [],
    used: new Set(),
    alive: true,
    logDelta: null,
    体质: 50 + ri(-8, 8),
    智力: 50 + ri(-8, 8),
    魅力: 50 + ri(-8, 8),
    心情: 60,
    健康: 80,
    运气: 50 + ri(-10, 10),
  };
  st.money = fam.money;
  applyEff(st, fam.eff, true);
  for (const t of talents) applyEff(st, t.eff, true);
  return st;
}

/** 属性/资产增减。silent=true 时不记账（用于出生初始化） */
function applyEff(st, eff, silent) {
  if (!eff) return;
  const list = [];
  for (const k of Object.keys(eff)) {
    const v = eff[k];
    if (!v) continue;
    if (k === 'money') {
      st.money += v;
      list.push([k, v, `资产${v > 0 ? '+' : '-'}${money1(Math.abs(v))}万`]);
    } else {
      const before = st[k];
      st[k] = clamp(st[k] + v);
      const real = Math.round(st[k] - before);
      if (real) list.push([k, real, `${k}${real > 0 ? '+' : ''}${real}`]);
    }
  }
  if (!silent && list.length) st.logDelta = (st.logDelta || []).concat(list);
}

/** 追加一条无属性变化的说明（如“亏了 3.2 万”） */
function note(st, text, dir) {
  st.logDelta = (st.logDelta || []).concat([['note', dir || 1, text]]);
}

/** 成就去重写入 */
function gain(st, name) {
  if (!st.achievements.includes(name)) st.achievements.push(name);
}

function setJob(st, id) {
  const j = JOBS[id] || JOBS.odd;
  st.job = j.name;
  st.salary = j.salary;
  st.jobYears = 0;
  gain(st, `成为${j.name}`);
}

/* ---------- 学历推进（在事件选取之前跑） ---------- */
function advanceEdu() {
  const st = s;
  if (st.age === 6) st.edu = '小学';
  else if (st.age === 12) st.edu = '初中';
  else if (st.age === 15) st.edu = '初中';
  else if (st.age === 18) st.edu = '高中';
  else if (st.age === 19 && st.edu === '高中') {
    // 高考结果：智力为主，心情与运气各占一点，另加一点随机
    const sc = st.智力 * 0.6 + st.心情 * 0.15 + st.运气 * 0.25 + rnd(-10, 10);
    if (sc >= 72) st.edu = '本科';
    else if (sc >= 58) st.edu = '大专';
    else if (sc >= 45) st.edu = '中专';
  }
}

/* ---------- 年度收支与自然变化 ---------- */
function settleYear() {
  const st = s;
  if (st.age < 22) { st.money += some(0.5) ? 1 : 0; return; }
  if (st.job === JOBS.researcher.name) { st.money += rnd(0, 2); return; }   // 研究生：补贴与兼职
  if (!st.job) { st.money -= 1.5; return; }                                 // 待业也要吃饭

  st.jobYears += 1;
  const growth = 1 + Math.min(0.9, st.jobYears * 0.05);
  const income = st.salary * growth * rnd(0.92, 1.08);
  let cost = 3 + st.kids * 2 + (st.house ? 3 : 1.5);
  if (st.loan) cost += 6;
  if (st.age >= 62) cost = 3 + st.kids * 0.2;
  st.money += income - cost;
  if (st.money < -30 && some(0.35)) {
    st.心情 = clamp(st.心情 - 5);
    note(st, '债务压得人喘不过气', -1);
  }
  // 自然折旧：35 岁后开始走下坡，60 岁后更快；心情好则略有回补
  if (st.age > 35) st.健康 = clamp(st.健康 - (st.age > 60 ? 1.3 : 0.5));
  if (st.心情 > 60) st.健康 = clamp(st.健康 + 0.3);
}

/* ---------- 事件选取 ---------- */
function chooseEvents() {
  const pool = EVENTS.filter((e) => {
    if (s.age < e.ages[0] || s.age > e.ages[1]) return false;
    if (e.once && s.used.has(e.id)) return false;
    if (e.cond && !e.cond(s)) return false;
    return true;
  });
  if (!pool.length) return null;
  const total = pool.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * total;
  for (const e of pool) {
    r -= e.w;
    if (r <= 0) return e;
  }
  return pool[pool.length - 1];
}

/* ---------- 记账 ---------- */
function addLog(title, text, tone) {
  s.log.push({
    age: s.age, year: s.birth + s.age, title, text,
    tone: tone || 'plain', delta: s.logDelta || [],
  });
  s.logDelta = null;
}

/* ---------- 死亡判定 ---------- */
function checkDeath() {
  const st = s;
  if (st.健康 <= 0) {
    st.alive = false;
    addLog('终结', '身体先一步替你做了决定，剩下的事都来不及安排了。', 'bad');
    return;
  }
  if (st.age < 45) return;
  let p = (st.age - 45) * 0.006;
  p *= (1.7 - st.健康 / 100);
  p *= (1.25 - st.体质 / 200);
  if (st.age > 85) p += (st.age - 85) * 0.04;
  if (st.age >= 100) p = 1;
  if (some(Math.min(0.9, p))) {
    st.alive = false;
    addLog('终结',
      st.age >= 85 ? '你在睡梦里安静地走了，没有惊动谁。' : '走得有些突然，很多话还没来得及说。',
      'bad');
  }
}

/* ---------- 事件结算 ---------- */
function decideTone(eff) {
  if (!eff) return 'plain';
  let score = 0;
  for (const k of Object.keys(eff)) {
    const v = eff[k];
    if (!v) continue;
    if (k === 'money') score += v > 0 ? 1 : -1;
    else if (k === '心情' || k === '健康' || k === '体质') score += v > 0 ? 1 : -1;
    else score += v > 0 ? 0.5 : -0.5;
  }
  if (score > 0.5) return 'good';
  if (score < -0.5) return 'bad';
  return 'plain';
}

function resolveChoice(idx) {
  const ev = pending;
  if (!ev) return;
  const c = ev.choices[idx];
  s.logDelta = null;
  applyEff(s, c.eff);
  if (c.fn) c.fn(s);
  addLog(ev.title, c.res || ev.text, decideTone(c.eff));
  pending = null;
  checkDeath();
  if (s.alive) { render(); renderAfterStep(); }
  else showEnd();
}

/* ---------- 推进一年 ---------- */
function nextYear() {
  if (!s.alive || pending) return;
  s.age += 1;
  s.logDelta = null;
  advanceEdu();
  settleYear();

  // 研究生毕业：25 岁自动进入职场
  if (s.age === 25 && s.job === JOBS.researcher.name) {
    setJob(s, 'bigco');
    addLog('毕业', '你终于从学校出来了，带着一纸文凭和一身疲惫。', 'good');
  }

  const ev = chooseEvents();
  if (!ev) {
    addLog('这一年', '日子平平地过去了，没有留下什么值得记的事。', 'plain');
    checkDeath();
    return;
  }
  if (ev.once) s.used.add(ev.id);

  if (ev.auto) {
    applyEff(s, ev.eff);
    addLog(ev.title, ev.text, 'plain');
    checkDeath();
    return;
  }
  pending = ev;   // 有选项：等玩家决定
}

function step() {
  if (!s) return;
  if (!s.alive) { showEnd(); return; }
  if (pending) return;              // 有选项未决时不能跳过
  nextYear();
  render();
  if (!s.alive) { showEnd(); return; }
  renderAfterStep();
}

/* =====================================================================
   渲染
   ===================================================================== */
const $ = (id) => document.getElementById(id);

function render() {
  if (!s) return;
  $('pName').textContent = s.name;
  $('pStage').textContent = stageOf(s.age);
  $('pEdu').textContent = s.edu;
  $('pJob').textContent = s.job || '待业';
  $('pYear').textContent = s.birth + s.age;
  $('pAge').textContent = s.age;
  $('pMoney').textContent = `${money1(s.money)} 万`;
  $('pMoney').style.color = s.money < 0 ? 'var(--red)' : '';

  $('attrs').innerHTML = ATTRS.map((a) => {
    const v = Math.round(s[a.k]);
    return `<div class="attr">
      <div class="row"><span class="k">${a.k}</span><span class="v">${v}</span></div>
      <div class="bar ${a.cls}"><i style="width:${v}%"></i></div>
    </div>`;
  }).join('');

  const facts = [
    ['出身', s.family.name],
    ['婚否', s.married ? '已婚' : '未婚'],
    ['子女', s.kids ? `${s.kids} 个` : '无'],
    ['住房', s.house ? (s.loan ? '有房（贷款中）' : '有房') : '无房'],
    ['年薪', s.job && s.salary ? `${Math.round(s.salary)} 万` : '—'],
  ];
  $('facts').innerHTML = facts.map((f) => `<div><span>${f[0]}</span> · ${f[1]}</div>`).join('');
  $('traits').innerHTML = s.talents
    .map((t) => `<span class="trait" title="${t.desc}">${t.name}</span>`).join('');

  renderLog();
}

function renderLog() {
  const box = $('log');
  box.innerHTML = s.log.map((e) => {
    const d = (e.delta && e.delta.length)
      ? `<div class="delta">${e.delta.map((x) => {
          const isNote = x[0] === 'note';
          const cls = isNote ? 'note' : (x[1] > 0 ? 'up' : 'down');
          return `<span class="${cls}">${x[2]}</span>`;
        }).join('')}</div>`
      : '';
    return `<div class="entry ${e.tone}">
      <div class="meta">${e.age} 岁 · 公元 ${e.year} 年</div>
      <div class="ttl">${e.title}</div>
      <div class="txt">${e.text}</div>${d}
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function renderEvent(ev) {
  $('evStage').textContent = `${stageOf(s.age)} · ${s.age} 岁`;
  $('evTitle').textContent = ev.title;
  $('evText').textContent = ev.text;
  $('evHint').textContent = '做出你的选择';
  $('nextBtn').classList.add('hidden');
  const box = $('evChoices');
  box.innerHTML = '';
  ev.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = c.label;
    b.onclick = () => resolveChoice(i);
    box.appendChild(b);
  });
}

function renderIdle() {
  $('evStage').textContent = `${stageOf(s.age)} · ${s.age} 岁`;
  $('evTitle').textContent = s.alive ? '接下来的一年' : '这一生结束了';
  $('evText').textContent = s.alive
    ? '时间继续往前走。按下继续，让下一年开始。'
    : '这一生的账目已经结清。';
  $('evChoices').innerHTML = '';
  $('evHint').textContent = '回车 / 空格 也可继续';
  $('nextBtn').textContent = s.alive ? '继续' : '查看结局';
  $('nextBtn').classList.remove('hidden');
}

function renderAfterStep() {
  if (pending) renderEvent(pending);
  else renderIdle();
}

/* ---------- 结局 ---------- */
function evaluate() {
  const st = s;
  let score = 0;
  score += clamp(st.健康, 0, 100) * 0.22;             // 22
  score += clamp(st.心情, 0, 100) * 0.22;             // 22
  score += Math.max(-8, Math.min(26, st.money / 14)); // 26
  score += (EDU_POINT[st.edu] || 0);                  // 16
  score += st.married ? 6 : 0;
  score += Math.min(9, st.kids * 3);
  score += Math.min(12, st.achievements.length * 1.6);
  if (st.age >= 80) score += 6;
  if (st.house) score += 3;
  score = Math.round(clamp(score, 0, 100));

  let rank, color, para;
  if (score >= 84) {
    rank = '传奇一生'; color = '#a8382c';
    para = '你几乎把每一个岔路口都走对了。财富、健康、感情、名声，你握住了大部分，也没在最要紧的事上失手。别人提起你时，会用“这辈子值了”这样的说法。';
  } else if (score >= 70) {
    rank = '圆满'; color = '#9a7b28';
    para = '你的日子有厚度：做成了些事，爱过几个人，身体也还算争气。回头看，遗憾是有的，但都不至于让你夜里睡不着。';
  } else if (score >= 56) {
    rank = '安稳'; color = '#3f6b4f';
    para = '你没有被生活特别优待，也没有被它特别为难。上班、回家、吃饭、睡觉，一年一年地过完了。这本身已经很难。';
  } else if (score >= 40) {
    rank = '寻常'; color = '#3d5a80';
    para = '你错过了一些机会，也做错了一些决定。但你也撑着把该担的责任担到了今天。大多数人的人生，都是这个分数。';
  } else if (score >= 25) {
    rank = '坎坷'; color = '#7a6a55';
    para = '病痛、亏空、离散，你尝过的比一般人多。你在很多个夜里想过“要不就算了”，但第二天你还是起来了。';
  } else {
    rank = '潦草'; color = '#6a6a6a';
    para = '这一生走得太急，也太轻。很多牌你本来可以打得更好——不过人生从不发第二副牌。';
  }
  return { score, rank, color, para };
}

function showEnd() {
  if (!s) return;
  const st = s;
  $('game').classList.add('hidden');
  $('end').classList.remove('hidden');
  const { score, rank, color, para } = evaluate();

  $('endSub').textContent = `${st.name} · ${st.birth} - ${st.birth + st.age} · 享年 ${st.age} 岁`;
  $('endRank').textContent = rank;
  $('endRank').style.color = color;
  $('endScore').textContent = `人生评分 ${score} / 100`;

  const strong = ATTRS.map((a) => ({ k: a.k, v: st[a.k] })).sort((a, b) => b.v - a.v)[0];
  const weak = ATTRS.map((a) => ({ k: a.k, v: st[a.k] })).sort((a, b) => a.v - b.v)[0];
  const extra = `你这一生最不缺的是${strong.k}（${Math.round(strong.v)}），最欠缺的是${weak.k}（${Math.round(weak.v)}）。`
    + (st.kids ? `你留下了 ${st.kids} 个孩子。` : '你没有留下孩子。')
    + (st.achievements.length ? `值得记下的有：${st.achievements.slice(0, 6).join('、')}。` : '');
  $('endPara').textContent = para + extra;

  const lines = [
    ['学历', st.edu],
    ['职业', st.job || '一生未曾稳定就业'],
    ['婚姻', st.married ? '有伴侣' : '未婚'],
    ['子女', st.kids ? `${st.kids} 个` : '无'],
    ['住房', st.house ? '有房' : '无房'],
    ['最终资产', `${money1(st.money)} 万`],
    ['体质', Math.round(st.体质)],
    ['智力', Math.round(st.智力)],
    ['魅力', Math.round(st.魅力)],
    ['心情', Math.round(st.心情)],
  ];
  $('endLines').innerHTML = lines.map((l) => `<div class="li"><span>${l[0]}</span>${l[1]}</div>`).join('');
  $('endMiles').innerHTML = (st.achievements.length ? st.achievements : ['无'])
    .map((a) => `<span class="mile">${a}</span>`).join('');
}

/* =====================================================================
   交互
   ===================================================================== */
function startLife() {
  const nm = $('nameInput').value.trim();
  s = newState(nm);
  pending = null;
  addLog('出生', `你出生在一个${s.family.name}。${s.family.text}`, 'good');
  if (s.talents.length) {
    s.log[s.log.length - 1].delta = s.talents.map((t) => ['note', 1, `天赋「${t.name}」`]);
  }
  $('start').classList.add('hidden');
  $('end').classList.add('hidden');
  $('game').classList.remove('hidden');
  render();
  renderIdle();
}

$('startBtn').onclick = startLife;
$('nextBtn').onclick = step;
$('againBtn').onclick = () => {
  $('end').classList.add('hidden');
  $('start').classList.remove('hidden');
  s = null; pending = null;
};

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (!$('start').classList.contains('hidden')) { e.preventDefault(); startLife(); return; }
  if (!$('game').classList.contains('hidden')) { e.preventDefault(); step(); }
});
</script>
</body>
